<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
 
<body class=" min-h-screen  bg-red-400 flex flex-col justify-center items-center">
   
<h2 class="text-center text-white text-3xl font-bold mb-6">Check the Weather Condition of your city</h2>
    <div class="bg-gray-200 rounded-xl border-2 border-white text-center max-w-xs backdrop-blur drop-shadow-md p-5">

        <h3 class="text-2xl text-center font-semibold">Weather App</h3>

        <div class="flex gap-2 items-center justify-center w-full mt-5">
            <input type="text" placeholder="enter city" id="SearchInput" class="flex-1 min-w-0 px-4 py-3 rounded-xl outline-none  text-black placeholder-gray-500" >
            <button id="SearchBtn" class="bg-white text-blue-600 font-semibold px-4 sm:px-5 py-3 rounded-xl hover:bg-blue-100">Search</button>
        </div>


        <div class="text-center hidden " id="weatherInfo">
            <img src="" alt="" id="weatherIcon">

            <h3  id="cityName" class="text-3xl font-bold mb-2 "></h3>
            <p id="temperature" class="text-4xl font-extrabold mb-2"></p>
            <p id="condition" class="text-lg mb-5"></p>
            <div class="grid grid-cols-2 gap-2">
                    <div class="bg-white/20 rounded-2xl p-4 shadow-lg backdrop-blur-md">
                        <p class="text-sm sm:text-base font-semibold">Humidity</p>
                        <p id="humidity" class="text-xl sm:text-2xl font-bold mt-2 break-words"></p>
                    </div>


                    <div class="bg-white/20 rounded-2xl p-4 shadow-lg backdrop-blur-md">
                        <p class="text-sm sm:text-base font-semibold">Wind Speed</p>
                        <p id="windSpeed" class="text-xl sm:text-2xl font-bold mt-2 break-words"></p>
                    </div>
            </div>
        </div>
    </div>
    
</body>



<script>

const SearchInput  = document.getElementById("SearchInput") 
const SearchBtn  = document.getElementById("SearchBtn")
const cityName  = document.getElementById("cityName")
const temperature  = document.getElementById("temperature")
const condition  = document.getElementById("condition")
const humidity  = document.getElementById("humidity")
const windSpeed  = document.getElementById("windSpeed")
const weatherIcon = document.getElementById("weatherIcon")

const apiKey = "33dd51471456f79ce10a6da10ce01f1c";
SearchBtn.addEventListener("click" ,()=>{
    const city = SearchInput.value
    if(city.trim() === ""){
        alert("Please enter the city name")
        return
    }

   fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`).then((response)=>{
    response.json().then((data)=>{

         if (data.cod == "404") {
                alert("City not found!");
                document.getElementById("weatherInfo").classList.add("hidden");
                return;
            }

            document.getElementById("weatherInfo").classList.remove("hidden");



        cityName.innerHTML  = data.name;
        temperature.innerHTML = `${Math.round(data.main.temp)}°C`
        condition.innerHTML = data.weather[0].main;
        humidity.innerText = `${data.main.humidity}%`;
        windSpeed.innerText = `${data.wind.speed} km/h`
        const iconCode = data.weather[0].icon;
        weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`





    })
   })
})



</script>
</html>
